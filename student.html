<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPrep – Student</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><nav class="side"><div class="logo">EduPrep</div><a data-v="home">Dashboard</a><a data-v="browse">Browse courses</a><a data-v="learn">My learning</a><a data-v="results">My results</a><a data-v="profile">Profile</a><a class="out" id="out">Log out</a></nav><main id="m"></main></div><div id="toast"></div>
<script src="app.js"></script><script>
let me=Auth.need('student'),view='home',sel=null,pay=null;
const T=t=>DB.get(t),cat=id=>T('exam_category').find(c=>c.category_id==id),course=id=>T('course').find(c=>c.course_id==id);
const mine=()=>T('enrollment').filter(e=>e.student_id==me.student_id),paid=e=>T('payment').find(p=>p.enrollment_id==e.enrollment_id);
const inr=n=>n>0?'₹'+Number(n).toLocaleString('en-IN'):'Free';
function go(v,s=null){view=v;sel=s;pay=null;document.querySelectorAll('.side a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v==(v=='course'?'learn':v)));R()}
document.querySelectorAll('.side a[data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));$('#out').onclick=()=>Auth.out();
const empty=t=>`<div class="card empty">${t}</div>`;
function R(){me=DB.get('student').find(s=>s.student_id==me.student_id);const m=$('#m');
 if(view=='home'){const at=T('attempt').filter(a=>a.student_id==me.student_id),en=mine();
  m.innerHTML=`<div class="banner"><h2>Hello, ${esc(me.name.split(' ')[0])}</h2><p>${me.registered_exam_id?'Preparing for '+esc(cat(me.registered_exam_id)?.category_name):'Choose your exam in Profile to see courses.'}</p></div>
  <div class="stats"><div class="card stat"><b>${en.length}</b><span>Courses enrolled</span></div><div class="card stat"><b>${at.length}</b><span>Tests attempted</span></div><div class="card stat"><b>${at.length?Math.min(...at.map(a=>a.rank_no||99)):'–'}</b><span>Best rank</span></div></div>
  <h3>Continue learning</h3>${en.length?`<div class="grid">${en.map(e=>courseCard(course(e.course_id),1)).join('')}</div>`:empty('You have not enrolled yet. <br><br><button class="btn" onclick="go(\'browse\')">Browse courses</button>')}`}
 if(view=='browse'){const id=me.registered_exam_id;if(!id)return m.innerHTML=empty('Select your exam in Profile first.');const cs=T('course').filter(c=>c.category_id==id),ids=mine().map(e=>e.course_id);
  m.innerHTML=`<div class="top"><h2>${esc(cat(id).category_name)} courses</h2></div>${pay?payForm():''}${cs.length?`<div class="grid">${cs.map(c=>`<div class="card"><span class="tag">${esc(cat(c.category_id).category_name)}</span><h3 style="margin:0">${esc(c.title)}</h3><p class="m">${esc(c.description||'')}</p><div class="price">${inr(c.price)}</div>${ids.includes(c.course_id)?`<button class="btn o" onclick="go('course',${c.course_id})">Open course</button>`:`<button class="btn" onclick="pay=${c.course_id};R()">Enroll</button>`}</div>`).join('')}</div>`:empty('No courses for this exam yet. Faculty will add them soon.')}`}
 if(view=='learn')m.innerHTML=`<div class="top"><h2>My learning</h2></div>${mine().length?`<div class="grid">${mine().map(e=>courseCard(course(e.course_id),1)).join('')}</div>`:empty('No enrollments yet.')}`;
 if(view=='course')courseView();
 if(view=='results'){const at=T('attempt').filter(a=>a.student_id==me.student_id);m.innerHTML=`<div class="top"><h2>My results</h2></div><div class="card wrap">${at.length?`<table><tr><th>Test</th><th>Course</th><th>Date</th><th>Score</th><th>Rank</th></tr>${at.map(a=>{const t=T('test').find(x=>x.test_id==a.test_id);return`<tr><td>${esc(t.title)}</td><td>${esc(course(t.course_id).title)}</td><td>${a.attempt_date}</td><td>${a.score}/${t.total_marks}</td><td><span class="tag ok">#${a.rank_no}</span></td></tr>`}).join('')}</table>`:'<div class="empty">No attempts yet.</div>'}</div>`}
 if(view=='profile')m.innerHTML=`<div class="top"><h2>Profile</h2></div><form class="card" id="pf" style="max-width:620px"><div class="f2"><div><label>Name</label><input name="name" value="${esc(me.name)}" required maxlength=100></div><div><label>Email</label><input value="${esc(me.email)}" disabled></div><div><label>Phone</label><input name="phone" value="${esc(me.phone)}" maxlength=15></div><div><label>City</label><input name="city" value="${esc(me.city)}" maxlength=50></div></div><label>Registered exam</label><select name="registered_exam_id">${T('exam_category').map(c=>`<option value="${c.category_id}" ${c.category_id==me.registered_exam_id?'selected':''}>${esc(c.category_name)}</option>`)}</select><p class="m" style="margin-top:10px">Registered on ${me.registration_date}</p><br><button class="btn">Save changes</button></form>`,
  $('#pf').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.registered_exam_id=+v.registered_exam_id;DB.update('student','student_id',me.student_id,v);toast('Profile saved');R()}}
function courseCard(c,o){const en=mine().find(e=>e.course_id==c.course_id),ls=T('lecture').filter(l=>l.course_id==c.course_id).length;return`<div class="card"><span class="tag">${esc(cat(c.category_id).category_name)}</span><h3 style="margin:0">${esc(c.title)}</h3><p class="m">${ls} lectures · ${T('test').filter(t=>t.course_id==c.course_id).length} tests</p><button class="btn" onclick="go('course',${c.course_id})">Open course</button></div>`}
function payForm(){const c=course(pay);return`<form class="card" id="pyf" style="max-width:480px"><h3>Enroll in ${esc(c.title)}</h3><div class="price">${inr(c.price)}</div>${c.price>0?`<label>Payment mode</label><select name="mode"><option>UPI</option><option>Card</option><option>NetBanking</option></select><p class="m" style="margin-top:8px">Payment is simulated and recorded in the payment table.</p>`:''}<div class="row" style="margin-top:14px"><button class="btn">${c.price>0?'Pay & enroll':'Enroll free'}</button><button type="button" class="btn o" onclick="pay=null;R()">Cancel</button></div></form>`}
document.addEventListener('submit',e=>{if(e.target.id!='pyf')return;e.preventDefault();const c=course(pay);if(mine().some(x=>x.course_id==c.course_id))return;const en=DB.insert('enrollment','enrollment_id',{student_id:me.student_id,course_id:c.course_id,enrollment_date:today()});
 if(c.price>0)DB.insert('payment','payment_id',{enrollment_id:en.enrollment_id,amount:c.price,mode:e.target.mode.value,payment_date:today(),status:'Success',transaction_ref:'TXN'+Date.now(),updated_at:now()});toast('Enrolled successfully');go('course',c.course_id)});
function courseView(){const c=course(sel),ls=T('lecture').filter(l=>l.course_id==c.course_id).sort((a,b)=>a.seq_no-b.seq_no),ts=T('test').filter(t=>t.course_id==c.course_id),at=T('attempt').filter(a=>a.student_id==me.student_id);
 $('#m').innerHTML=`<div class="top"><div><button class="btn o s" onclick="go('learn')">← Back</button><h2 style="margin-top:10px">${esc(c.title)}</h2></div></div>
 <div class="card"><h3>Lectures</h3>${ls.length?`<table>${ls.map(l=>`<tr><td>${l.seq_no}</td><td>${esc(l.title)}<div class="m">${esc(T('instructor').find(i=>i.instructor_id==l.instructor_id)?.name||'')}</div></td><td>${l.duration_min||'–'} min</td><td><a href="${esc(l.video_link)}" target="_blank" rel="noopener" class="btn s">Watch</a></td></tr>`).join('')}</table>`:'<div class="empty">No lectures yet.</div>'}</div>
 <div class="card"><h3>Test series &amp; notes</h3>${ts.length?`<div class="wrap"><table><tr><th>Title</th><th>Marks</th><th>Time</th><th>Paper / notes</th><th>Your result</th></tr>${ts.map(t=>{const a=at.find(x=>x.test_id==t.test_id);return`<tr><td>${esc(t.title)}</td><td>${t.total_marks}</td><td>${t.duration_min||'–'} min</td><td><button class="btn y s" onclick="dl(${t.test_id})">Download</button></td><td>${a?`${a.score}/${t.total_marks} <span class="tag ok">Rank #${a.rank_no}</span>`:`<form class="row" onsubmit="att(event,${t.test_id})"><input name="s" type="number" min="0" max="${t.total_marks}" required placeholder="Score" style="width:90px"><button class="btn s">Save</button></form>`}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No tests yet.</div>'}</div>`}
function dl(id){download(T('test').find(t=>t.test_id==id).test_paper_link)}
function att(e,tid){e.preventDefault();const t=T('test').find(x=>x.test_id==tid),s=+e.target.s.value;if(s>t.total_marks||s<0)return toast('Score cannot exceed test total marks.');
 DB.insert('attempt','attempt_id',{student_id:me.student_id,test_id:tid,attempt_date:today(),score:s,rank_no:null});
 const all=T('attempt').filter(a=>a.test_id==tid);all.forEach(a=>a.rank_no=1+all.filter(b=>b.score>a.score).length);const rest=T('attempt').filter(a=>a.test_id!=tid);DB.set('attempt',rest.concat(all));toast('Attempt recorded');courseView()}
go('home');
</script></body></html>
