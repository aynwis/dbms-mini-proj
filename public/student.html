<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPrep – Student</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><nav class="side"><div class="logo">EduPrep</div><a data-v="home">Dashboard</a><a data-v="browse">Browse courses</a><a data-v="learn">My learning</a><a data-v="results">My results</a><a data-v="profile">Profile</a><a class="out" id="out">Log out</a></nav>
<main><div id="flash"></div><div id="m"></div></main></div><div id="toast"></div>
<script src="app.js"></script><script>
// State of the page. Data is NOT kept here: every render asks the server again.
let view = 'home', sel = null, payFor = null;

// keep=true: navigate after a write without hiding that write's SQL from the panel
function go(v, s = null, keep = false) {
  view = v; sel = s; payFor = null;
  if (!keep) { Panel.freeze = false; flash(''); }
  document.querySelectorAll('.side a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v == (v == 'course' ? 'learn' : v)));
  R();
}
document.querySelectorAll('.side a[data-v]').forEach(a => a.onclick = () => go(a.dataset.v));
$('#out').onclick = () => Auth.logout();

// Run a write (button click), show the database's message, then re-render from the server.
async function doAction(method, url, body, okText) {
  try {
    const r = await act(method, url, body);
    flash(okText ? okText(r) : r.message, false);
    return r;
  } catch (e) { flash(e.message, true); return null; }
}

async function R() {
  try {
    if (view == 'home') await home();
    else if (view == 'browse') await browse();
    else if (view == 'learn') await learn();
    else if (view == 'course') await courseView();
    else if (view == 'results') await results();
    else if (view == 'profile') await profile();
  } catch (e) { flash(e.message, true); }
}

function courseCard(c) {
  return `<div class="card"><span class="tag">${esc(c.category_name)}</span><h3 style="margin:0">${esc(c.course_name)}</h3>
    <p class="m">${c.lecture_count} lectures · ${c.test_count} tests</p><button class="btn" onclick="go('course',${c.course_id})">Open course</button></div>`;
}

/* ---- Dashboard: v_student_dashboard ---- */
async function home() {
  const { dash, courses } = await api('GET', '/api/student/overview');
  $('#m').innerHTML = `<div class="banner"><h2>Hello, ${esc(dash.name.split(' ')[0])}</h2><p>${dash.exam_name ? 'Preparing for ' + esc(dash.exam_name) : 'Choose your exam in Profile to see courses.'}</p></div>
  <div class="stats"><div class="card stat"><b>${dash.courses_enrolled}</b><span>Courses enrolled</span></div>
  <div class="card stat"><b>${dash.tests_attempted}</b><span>Tests attempted</span></div>
  <div class="card stat"><b>${dash.best_rank ?? '–'}</b><span>Best rank</span></div>
  <div class="card stat"><b>${dash.avg_score ?? '–'}</b><span>Average score</span></div></div>
  <h3>Continue learning</h3>${courses.length ? `<div class="grid">${courses.map(courseCard).join('')}</div>` : empty('You have not enrolled yet.<br><br><button class="btn" onclick="go(\'browse\')">Browse courses</button>')}`;
}

/* ---- Browse: v_course_catalog (Approved courses of my exam) ---- */
async function browse() {
  const { exam, courses } = await api('GET', '/api/student/courses');
  if (!exam) { $('#m').innerHTML = empty('Select your exam in Profile first.'); return; }
  const c = payFor && courses.find(x => x.course_id == payFor);
  $('#m').innerHTML = `<div class="top"><h2>${esc(exam)} courses</h2></div>${c ? payForm(c) : ''}
  ${courses.length ? `<div class="grid">${courses.map(c => `<div class="card"><span class="tag">${esc(c.category_name)}</span><h3 style="margin:0">${esc(c.course_name)}</h3>
    <p class="m">${esc(c.description || '')}</p><p class="m">${esc(c.instructor_name)} · ${c.lecture_count} lectures · ${c.test_count} tests</p><div class="price">${inr(c.fee)}</div>
    ${c.enrolled ? `<button class="btn o" onclick="go('course',${c.course_id})">Open course</button>` : `<button class="btn" onclick="payFor=${c.course_id};R()">Enroll</button>`}</div>`).join('')}</div>`
    : empty('No approved courses for this exam yet.')}`;
  if (c) $('#pyf').onsubmit = enroll;
}

function payForm(c) {
  return `<form class="card" id="pyf" style="max-width:480px"><h3>Enroll in ${esc(c.course_name)}</h3><div class="price">${inr(c.fee)}</div>
  ${c.fee > 0 ? `<label>Payment mode</label><select name="mode"><option>UPI</option><option>Card</option><option>NetBanking</option></select>
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="simulate_fail" style="width:auto"> Simulate failed payment (shows the rollback)</label>` : '<p class="m">Free course: no payment row is created.</p>'}
  <div class="row" style="margin-top:14px"><button class="btn">${c.fee > 0 ? 'Pay & enroll' : 'Enroll free'}</button><button type="button" class="btn o" onclick="payFor=null;R()">Cancel</button></div></form>`;
}

async function enroll(e) {
  e.preventDefault();
  const f = e.target, id = payFor;
  const r = await doAction('POST', '/api/enroll',
    { course_id: id, mode: f.mode ? f.mode.value : '', simulate_fail: f.simulate_fail ? f.simulate_fail.checked : false });
  if (r) { go('course', id, true); flash(r.message, false); }   // success: open the course
  else R();                                            // error: stay, message is shown above, data re-read
}

async function learn() {
  const { courses } = await api('GET', '/api/student/overview');
  $('#m').innerHTML = `<div class="top"><h2>My learning</h2></div>${courses.length ? `<div class="grid">${courses.map(courseCard).join('')}</div>` : empty('No enrollments yet.')}`;
}

/* ---- Course page: lectures, tests, attempt form, cancel ---- */
async function courseView() {
  let d;
  try { d = await api('GET', '/api/student/courses/' + sel); }
  catch (e) { go('learn'); flash(e.message, true); return; }   // e.g. after cancelling, the course is no longer open to me
  const { course, lectures, tests } = d;
  $('#m').innerHTML = `<div class="top"><div><button class="btn o s" onclick="go('learn')">← Back</button><h2 style="margin-top:10px">${esc(course.course_name)}</h2><p class="m">${esc(course.instructor_name)}</p></div>
  <button class="btn d" onclick="cancelEnroll(${course.course_id})">Cancel enrollment</button></div>
  <div class="card"><h3>Lectures</h3>${lectures.length ? `<div class="wrap"><table>${lectures.map(l => `<tr><td>${l.seq_no}</td><td>${esc(l.title)}</td><td>${l.duration_min || '–'} min</td><td><a href="${esc(l.video_link)}" target="_blank" rel="noopener" class="btn s">Watch</a></td></tr>`).join('')}</table></div>` : '<div class="empty">No lectures yet.</div>'}</div>
  <div class="card"><h3>Test series &amp; notes</h3>${tests.length ? `<div class="wrap"><table><tr><th>Title</th><th>Marks</th><th>Time</th><th>Paper / notes</th><th>Your result</th></tr>
  ${tests.map(t => `<tr><td>${esc(t.title)}</td><td>${t.total_marks}</td><td>${t.duration_min || '–'} min</td>
  <td><a class="btn y s" href="${esc(t.test_paper_link)}" target="_blank" rel="noopener">Open paper</a></td>
  <td>${t.score != null ? `${t.score}/${t.total_marks} <span class="tag ok">Rank #${t.rank_no}</span>`
   : `<form class="row" data-test="${t.test_id}"><input name="score" type="number" required placeholder="Score" style="width:90px"><button class="btn s">Submit</button></form>`}</td></tr>`).join('')}</table></div>` : '<div class="empty">No tests yet.</div>'}</div>`;
  // The score input has NO max attribute on purpose: the value goes to MySQL and the trigger answers.
  document.querySelectorAll('form[data-test]').forEach(f => f.onsubmit = e => attempt(e, f.dataset.test));
}

async function attempt(e, testId) {
  e.preventDefault();
  const r = await doAction('POST', '/api/attempt', { test_id: +testId, score: e.target.score.value }, r => `${r.message}. Your rank is #${r.rank_no}.`);
  R();
}

async function cancelEnroll(id) {
  if (!confirm('Cancel this enrollment? Your payment record for it is removed too.')) return;
  const r = await doAction('DELETE', '/api/enroll/' + id);
  if (r) { go('browse', null, true); flash(r.message, false); } else R();
}

/* ---- Results: v_student_results (percentage and grade come from the database) ---- */
async function results() {
  const rows = await api('GET', '/api/student/results');
  $('#m').innerHTML = `<div class="top"><h2>My results</h2></div><div class="card wrap">${rows.length ? `<table><tr><th>Test</th><th>Course</th><th>Date</th><th>Score</th><th>Percentage</th><th>Grade</th><th>Rank</th></tr>
  ${rows.map(a => `<tr><td>${esc(a.test_title)}</td><td>${esc(a.course_name)}</td><td>${esc(a.attempt_date)}</td><td>${a.score}/${a.total_marks}</td><td>${a.percentage}%</td><td><b>${esc(a.grade)}</b></td><td><span class="tag ok">#${a.rank_no}</span></td></tr>`).join('')}</table>` : '<div class="empty">No attempts yet.</div>'}</div>`;
}

async function profile() {
  const me = (await api('GET', '/api/me')).user, cats = await api('GET', '/api/categories');
  $('#m').innerHTML = `<div class="top"><h2>Profile</h2></div><form class="card" id="pf" style="max-width:620px"><div class="f2">
  <div><label>Name</label><input name="name" value="${esc(me.name)}" required maxlength=100></div><div><label>Email</label><input value="${esc(me.email)}" disabled></div>
  <div><label>Phone</label><input name="phone" value="${esc(me.phone)}" maxlength=15></div><div><label>City</label><input name="city" value="${esc(me.city)}" maxlength=50></div></div>
  <label>Registered exam</label><select name="registered_exam_id">${cats.map(c => `<option value="${c.category_id}" ${c.category_id == me.registered_exam_id ? 'selected' : ''}>${esc(c.category_name)}</option>`).join('')}</select>
  <p class="m" style="margin-top:10px">Registered on ${esc(me.registration_date)}</p><br><button class="btn">Save changes</button></form>`;
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    if (await doAction('PUT', '/api/student/profile', v, () => 'Profile saved.')) R();
  };
}

(async () => { await Auth.need('student'); go('home'); })();
</script></body></html>
