<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPrep – Faculty</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><nav class="side"><div class="logo">EduPrep</div><a data-v="home">Dashboard</a><a data-v="courses">Courses</a><a data-v="lectures">Lectures</a><a data-v="papers">Papers &amp; notes</a><a data-v="results">Student results</a><a data-v="profile">Profile</a><a class="out" id="out">Log out</a></nav><main id="m"></main></div><div id="toast"></div>
<script src="app.js"></script><script>
let me=Auth.need('faculty'),view='home';const T=t=>DB.get(t),C=id=>T('course').find(c=>c.course_id==id),cat=id=>T('exam_category').find(c=>c.category_id==id)?.category_name;
const taught=()=>[...new Set(T('lecture').filter(l=>l.instructor_id==me.instructor_id).map(l=>l.course_id))];
const canTest=cid=>taught().includes(cid)||!T('lecture').some(l=>l.course_id==cid); // schema has no course owner: faculty manage tests where they teach, or where no lectures exist yet
const empty=t=>`<div class="card empty">${t}</div>`,opts=(a,k,n,s)=>a.map(x=>`<option value="${x[k]}" ${x[k]==s?'selected':''}>${esc(typeof n=='function'?n(x):x[n])}</option>`).join('');
function go(v){view=v;document.querySelectorAll('.side a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v==v));R()}
document.querySelectorAll('.side a[data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));$('#out').onclick=()=>Auth.out();
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
function R(){me=T('instructor').find(i=>i.instructor_id==me.instructor_id);const m=$('#m'),cs=T('course');
 if(view=='home'){const ls=T('lecture').filter(l=>l.instructor_id==me.instructor_id),ts=T('test').filter(t=>taught().includes(t.course_id));
  m.innerHTML=`<div class="banner"><h2>Welcome, ${esc(me.name)}</h2><p>${esc(me.qualification||'Faculty')} · ${me.experience_years} yrs experience</p></div><div class="stats"><div class="card stat"><b>${taught().length}</b><span>Courses taught</span></div><div class="card stat"><b>${ls.length}</b><span>Lectures added</span></div><div class="card stat"><b>${ts.length}</b><span>Papers published</span></div><div class="card stat"><b>${T('enrollment').filter(e=>taught().includes(e.course_id)).length}</b><span>Enrollments</span></div></div>${cs.length?'':empty('Start by creating a course.<br><br><button class="btn" onclick="go(\'courses\')">Create course</button>')}`}
 if(view=='courses'){m.innerHTML=`<div class="top"><h2>Courses</h2></div><form class="card" id="cf"><h3>New course</h3><div class="f2"><div><label>Title</label><input name="title" required maxlength=150></div><div><label>Exam category</label><select name="category_id">${opts(T('exam_category'),'category_id','category_name')}</select></div><div><label>Price (₹)</label><input name="price" type="number" min="0" step="0.01" value="0" required></div><div><label>Description</label><input name="description"></div></div><br><button class="btn">Create course</button></form>
  <div class="card wrap">${cs.length?`<table><tr><th>Title</th><th>Exam</th><th>Price</th><th>Enrolled</th><th></th></tr>${cs.map(c=>`<tr><td>${esc(c.title)}</td><td><span class="tag">${esc(cat(c.category_id))}</span></td><td>₹${c.price}</td><td>${T('enrollment').filter(e=>e.course_id==c.course_id).length}</td><td><button class="btn d s" onclick="delCourse(${c.course_id})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No courses yet.</div>'}</div>`;
  $('#cf').onsubmit=e=>{const v=fd(e);if(cs.some(c=>c.title.toLowerCase()==v.title.trim().toLowerCase()))return toast('A course with this title already exists.');DB.insert('course','course_id',{title:v.title.trim(),description:v.description||null,price:+v.price,category_id:+v.category_id,updated_at:now()});toast('Course created');R()}}
 if(view=='lectures'){const mine=T('lecture').filter(l=>l.instructor_id==me.instructor_id).sort((a,b)=>a.course_id-b.course_id||a.seq_no-b.seq_no);
  m.innerHTML=`<div class="top"><h2>Lectures</h2></div>${cs.length?`<form class="card" id="lf"><h3>Add lecture</h3><div class="f2"><div><label>Course</label><select name="course_id">${opts(cs,'course_id','title')}</select></div><div><label>Title</label><input name="title" required maxlength=150></div><div><label>Video link</label><input name="video_link" type="url" required maxlength=255></div><div><label>Duration (min)</label><input name="duration_min" type="number" min="1"></div><div><label>Sequence no.</label><input name="seq_no" type="number" min="1" required></div></div><br><button class="btn">Add lecture</button></form>`:empty('Create a course first.')}
  <div class="card wrap">${mine.length?`<table><tr><th>Course</th><th>#</th><th>Title</th><th>Min</th><th></th></tr>${mine.map(l=>`<tr><td>${esc(C(l.course_id).title)}</td><td>${l.seq_no}</td><td>${esc(l.title)}</td><td>${l.duration_min||'–'}</td><td><button class="btn d s" onclick="DB.del('lecture',x=>x.lecture_id==${l.lecture_id});R()">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">You have not added lectures.</div>'}</div>`;
  if($('#lf'))$('#lf').onsubmit=e=>{const v=fd(e);if(T('lecture').some(l=>l.course_id==v.course_id&&l.seq_no==v.seq_no))return toast('Sequence no. already used in this course.');DB.insert('lecture','lecture_id',{course_id:+v.course_id,instructor_id:me.instructor_id,title:v.title.trim(),video_link:v.video_link,duration_min:+v.duration_min||null,seq_no:+v.seq_no});toast('Lecture added');R()}}
 if(view=='papers'){const ok=cs.filter(c=>canTest(c.course_id)),ts=T('test').filter(t=>canTest(t.course_id));
  m.innerHTML=`<div class="top"><h2>Papers &amp; notes</h2></div>${ok.length?`<form class="card" id="tf"><h3>Upload paper / notes</h3><div class="f2"><div><label>Course</label><select name="course_id">${opts(ok,'course_id','title')}</select></div><div><label>Title</label><input name="title" required maxlength=150></div><div><label>Total marks</label><input name="total_marks" type="number" min="1" required></div><div><label>Duration (min)</label><input name="duration_min" type="number" min="1"></div><div><label>File (PDF, DOC, image…)</label><input name="file" type="file"></div><div><label>…or paste a link</label><input name="link" type="url" maxlength=255></div></div><br><button class="btn">Publish</button></form>`:empty('Add a lecture to a course you teach, or create a new course.')}
  <div class="card wrap">${ts.length?`<table><tr><th>Course</th><th>Title</th><th>Marks</th><th></th></tr>${ts.map(t=>`<tr><td>${esc(C(t.course_id).title)}</td><td>${esc(t.title)}</td><td>${t.total_marks}</td><td class="row"><button class="btn o s" onclick="download(DB.get('test').find(x=>x.test_id==${t.test_id}).test_paper_link)">Download</button><button class="btn d s" onclick="delTest(${t.test_id})">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">Nothing published yet.</div>'}</div>`;
  if($('#tf'))$('#tf').onsubmit=async e=>{const v=fd(e),f=e.target.file.files[0];if(!f&&!v.link)return toast('Attach a file or paste a link.');let link=v.link;
   if(f){const k='p'+Date.now();link='idb://'+k+'/'+encodeURIComponent(f.name);if(link.length>255)return toast('File name too long.');await IDB.put(k,f)}
   DB.insert('test','test_id',{course_id:+v.course_id,title:v.title.trim(),total_marks:+v.total_marks,duration_min:+v.duration_min||null,test_paper_link:link});toast('Published');R()}}
 if(view=='results'){const ts=T('test').filter(t=>taught().includes(t.course_id)),at=T('attempt'),st=T('student');
  m.innerHTML=`<div class="top"><h2>Student results</h2></div>${ts.length?ts.map(t=>`<div class="card wrap"><h3>${esc(t.title)} <span class="m">· ${esc(C(t.course_id).title)}</span></h3>${at.filter(a=>a.test_id==t.test_id).length?`<table><tr><th>Rank</th><th>Student</th><th>Date</th><th>Score</th></tr>${at.filter(a=>a.test_id==t.test_id).sort((a,b)=>a.rank_no-b.rank_no).map(a=>`<tr><td>#${a.rank_no}</td><td>${esc(st.find(s=>s.student_id==a.student_id)?.name)}</td><td>${a.attempt_date}</td><td>${a.score}/${t.total_marks}</td></tr>`).join('')}</table>`:'<div class="empty">No attempts.</div>'}</div>`).join(''):empty('Results appear for courses where you teach.')}`}
 if(view=='profile'){m.innerHTML=`<div class="top"><h2>Profile</h2></div><form class="card" id="pf" style="max-width:620px"><div class="f2"><div><label>Name</label><input name="name" value="${esc(me.name)}" required maxlength=100></div><div><label>Email</label><input value="${esc(me.email)}" disabled></div><div><label>Qualification</label><input name="qualification" value="${esc(me.qualification)}" maxlength=100></div><div><label>Experience (years)</label><input name="experience_years" type="number" min="0" value="${me.experience_years}"></div></div><br><button class="btn">Save changes</button></form>`;
  $('#pf').onsubmit=e=>{const v=fd(e);v.experience_years=+v.experience_years;DB.update('instructor','instructor_id',me.instructor_id,v);toast('Profile saved');R()}}}
function delCourse(id){if(T('enrollment').some(e=>e.course_id==id))return toast('Cannot delete: students are enrolled.');if(!confirm('Delete course with its lectures and tests?'))return;
 T('test').filter(t=>t.course_id==id).forEach(t=>delTest(t.test_id,1));DB.del('lecture',l=>l.course_id==id);DB.del('course',c=>c.course_id==id);R()}
function delTest(id,q){if(!q&&!confirm('Delete this paper and all attempts on it?'))return;const t=T('test').find(x=>x.test_id==id);if(t.test_paper_link.startsWith('idb://'))IDB.del(t.test_paper_link.slice(6).split('/')[0]);DB.del('attempt',a=>a.test_id==id);DB.del('test',x=>x.test_id==id);if(!q)R()}
go('home');
</script></body></html>
